name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Read churchtools metadata
              id: meta
              run: echo "key=$(node -p "require('./package.json').churchtools.extensionKey")" >> "$GITHUB_OUTPUT"

            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run build
              env:
                  VITE_KEY: ${{ steps.meta.outputs.key }}
                  VITE_BASE_URL: https://example.church.tools
